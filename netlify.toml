[build]
  publish = "."

[[redirects]]
  from = "/diagnostic"
  to = "/diagnostic.html"
  status = 200

[[redirects]]
  from = "/partner"
  to = "/diagnostic.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
